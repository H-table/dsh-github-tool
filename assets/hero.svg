<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1126"/>
      <stop offset="1" stop-color="#1e2c5a"/>
    </linearGradient>
    <linearGradient id="flowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b36"/>
      <stop offset="1" stop-color="#10152c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d5afe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3d5afe" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="1230" cy="320" r="420" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="72" y="150" fill="#f5f7fc" font-size="58" font-weight="700">DSH GitHub Tool</text>
  <text x="74" y="232" fill="#b0bad8" font-size="24">让 DeepSeek Harness 直连 GitHub：</text>
  <text x="74" y="272" fill="#b0bad8" font-size="24">REST / GraphQL 调用、一键提交文件、发 Discussion</text>

  <!-- chips -->
  <g font-size="15">
    <rect x="72" y="310" rx="19" width="196" height="38" fill="#287a5e" opacity="0.85"/>
    <text x="170" y="335" fill="#f5f7fc" text-anchor="middle">Token 走凭据系统加密存储</text>
    <rect x="286" y="310" rx="19" width="190" height="38" fill="#5b4cf0" opacity="0.85"/>
    <text x="381" y="335" fill="#f5f7fc" text-anchor="middle">4 个模型工具即装即用</text>
    <rect x="494" y="310" rx="19" width="168" height="38" fill="#8a4d24" opacity="0.9"/>
    <text x="578" y="335" fill="#f5f7fc" text-anchor="middle">可选 HTTP 代理直连</text>
    <rect x="680" y="310" rx="19" width="150" height="38" fill="#1f6f8b" opacity="0.9"/>
    <text x="755" y="335" fill="#f5f7fc" text-anchor="middle">插件配置卡片 UI</text>
  </g>

  <!-- Flow panel -->
  <g filter="url(#shadow)">
    <rect x="980" y="72" width="548" height="496" rx="24" fill="url(#flowBg)" stroke="#2b3a6e" stroke-width="1.5"/>
    <text x="1012" y="120" fill="#8fa0cf" font-size="16">一条调用链，四个工具</text>

    <!-- Agent node -->
    <rect x="1012" y="146" width="160" height="54" rx="12" fill="#3d5afe"/>
    <text x="1092" y="178" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">DSH Agent</text>

    <!-- arrow down -->
    <path d="M1092 200 v22" stroke="#8fa0cf" stroke-width="2.5" fill="none"/>
    <path d="M1086 218 l6 10 6-10" fill="#8fa0cf"/>

    <!-- tool chips -->
    <g font-size="14.5">
      <rect x="1012" y="234" width="230" height="44" rx="10" fill="#20294f" stroke="#3d5afe" stroke-opacity="0.6"/>
      <text x="1127" y="261" fill="#cdd6f5" text-anchor="middle">github_api · REST</text>
      <rect x="1262" y="234" width="234" height="44" rx="10" fill="#20294f" stroke="#3d5afe" stroke-opacity="0.6"/>
      <text x="1379" y="261" fill="#cdd6f5" text-anchor="middle">github_graphql · GraphQL</text>
      <rect x="1012" y="292" width="230" height="44" rx="10" fill="#20294f" stroke="#3d5afe" stroke-opacity="0.6"/>
      <text x="1127" y="319" fill="#cdd6f5" text-anchor="middle">github_push_files · 提交</text>
      <rect x="1262" y="292" width="234" height="44" rx="10" fill="#20294f" stroke="#3d5afe" stroke-opacity="0.6"/>
      <text x="1379" y="319" fill="#cdd6f5" text-anchor="middle">github_create_discussion</text>
    </g>

    <!-- arrows to GitHub -->
    <path d="M1012 336 v26 h-1" stroke="#8fa0cf" stroke-width="2.5" fill="none"/>
    <path d="M1252 314 v48 h-1" stroke="#8fa0cf" stroke-width="2.5" fill="none"/>
    <path d="M1127 336 v16 q0 14 14 14 h200 q14 0 14 14" stroke="#8fa0cf" stroke-width="2.5" fill="none"/>

    <!-- GitHub node -->
    <rect x="1012" y="396" width="484" height="100" rx="16" fill="#0f1428" stroke="#3d5afe" stroke-width="2"/>
    <g transform="translate(1036 424) scale(1.9)">
      <path fill="#f5f7fc" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </g>
    <text x="1140" y="446" fill="#f5f7fc" font-size="20" font-weight="600">GitHub</text>
    <text x="1140" y="472" fill="#8fa0cf" font-size="14.5">api.github.com · git data API · GraphQL</text>
  </g>
</svg>
